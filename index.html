    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is DSCFlow?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "DSCFlow is a free website and Secure Signing Service that lets you digitally sign PDFs with your USB DSC token — without uploading files to the cloud or creating an account."
            }
          },
          {
            "@type": "Question",
            "name": "Why do I need the Signing Service?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your USB token can only be accessed from software running on your computer. DSCFlow Secure Signing Service connects the website to your token securely on your PC."
            }
          },
          {
            "@type": "Question",
            "name": "Does my PDF leave my computer?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Signing happens locally through the Signing Service. Your document is not uploaded to DSCFlow servers."
            }
          },
          {
            "@type": "Question",
            "name": "Which DSC tokens are supported?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "DSCFlow discovers common Indian PKCS#11 middleware on Windows 10 and 11 — including Hypersecu, eMudhra, Capricorn, SafeScrypt, WatchData/ePass, SafeNet/eToken, Feitian, ProxKey, and others when their software is installed. Your token's middleware must be installed first."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need an account?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. DSCFlow does not require registration or login for the public beta."
            }
          },
          {
            "@type": "Question",
            "name": "Is DSCFlow free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The public beta website and DSCFlow Secure Signing Service are free to download and use."
            }
          },
          {
            "@type": "Question",
            "name": "DSC token not detected?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Use the DSC problems guides at https://dscflow.com/help/dsc-problems for token detection (including Windows 11, HYP2003, ePass 2003, and ProxKey), drivers, PIN, expired certificates, and PDF signature verification."
            }
          }
        ]
